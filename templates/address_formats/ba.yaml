# Bosnia and Herzegovina
BA:
  multiline_template: |
    {{{street_name}}} {{{street_number}}}
    {{{house_name}}} {{{unit}}}
    {{{postalcode}}} {{#locality}}{{{locality}}}{{/locality}}{{^locality}}{{{city}}}{{/locality}} {{{state}}}
    {{{country}}}
  singleline_template: >
    {{{street_name}}} {{{street_number}}}, 
    {{{house_name}}} {{{unit}}},
    {{{postalcode}}} {{#locality}}{{{locality}}}{{/locality}}{{^locality}}{{{city}}}{{/locality}} {{{state}}},
    {{{country}}}
